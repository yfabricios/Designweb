<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="main.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String e Data</title>
</head>
<body>
    <script>
        //estruturas de repetição
        for(let i=0; i<=10; i++){
            console.log(i);
        }
    </script>
    <h1>String e Data</h1>
    <h2>String</h2>
    
    <script>
        let nome = 'INFOWEB';
        console.log("Comprimento da String: "+nome.length);
        console.log("Posição do caracter da string: "+nome.charAt(3))
        console.log("Substitui a string: "+nome.replace('INFO', 'Informática para '));
        console.log("Fatia a string"+nome.slice(2,4))
        //slice recebe dois parâmetros: posição incial e a posião final (a final não é impressa)
        console.log("Coloca em minúsculas: "+nome.toLowerCase());
        console.log("Coloca em maiúsculas: "+"ifrn".toUpperCase())
        console.log("Concatena strings: " + nome.concat(" IFRN"))
    </script>

    <h2>EXEMPLO</h2>
    <p id="resultado"></p>

    <script>
        let nome2 = 'DESIGN WEB'
        for(let i=0; i<=nome2.length; i++){
            document.getElementById('resultado').innerHTML += 

            '<span style=font-size:'+(i+1)+'rem>' +
            nome2.charAt(i)+
            '</span>'
        }
    </script>

    <h2>DATA</h2>
    <p id="data"></p>
    <p id="segundos"></p>

    <script>
        const data = new Date()
        // data baseada na data que esta no computador do usuario

        console.log("Dia de hoje: "+data.getDate())
        console.log("Mês atual: "+data.getMonth()) // o mês começa com 0
        console.log("Ano corrente: "+data.getFullYear())

        console.log("Hora: "+data.getHours())
        console.log("Minutos: "+data.getMinutes())
        console.log("segundos: "+data.getSeconds())

        document.getElementById("data").innerHTML = data.getDate() +"/"+ data.getMonth() +"/"+ data.getFullYear()  

        function segundos(){
            const segundos = new Date()
            document.getElementById('segundos').innerHTML = segundos.getSeconds()
            // imprimir os segundos com o tamanho equivalente ao numero
            let seg = segundos
            for(let i=0; i<=seg.length; i++){
                document.getElementById('segundos').innerHTML += 
                '<span style=font-size:'+(i+1)+'rem>' +
                seg.getSeconds(i)+
                '</span>'
        }}
        setInterval(segundos,1000)
        // setInterval é uma função de timer, o 1 parametro recebe o nome da função (sem parenteses) e o 2 parametro recebe o tempo em milissegundos

        function aumentando(){
            const agora = new Date()
            const seg = agora.getSeconds()

            document.getElementById('segundos').innerHTML = ''

            for (let i = 1; i <= seg; i++){
                document.getElementById('segundos').innerHTML =
                    '<span style="font-size:' + i + 'rem">' + i + '</span>'
            }
        }
        setInterval(aumentando, 1000)

        
    </script>

</body>
</html>
