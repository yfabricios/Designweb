    <!-- Fazer um array com nomes de cores (7) e imprimir o seu nome (7 vezes) com as cores que estão no array -->
    <label>
        Nome: <input type="text" id="nome"> <br>
        <button id="gerar">GERAR</button>
        <p id="cores"></p>
    </label>
    <script>
        let gerar = document.querySelector('#gerar')
        gerar.addEventListener("click", function (e){
            let nome = document.querySelector('#nome').value
            const numeros = ['blue', 'yellow', 'pink', 'violet', 'red', 'brown', 'green']

            document.querySelector('#cores').style.color = numeros[Math.floor(Math.random()*7)]
            document.querySelector('#cores').innerHTML = nome
        })
