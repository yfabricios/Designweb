<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Estágio</title>
    <link rel="stylesheet" href="principal.css">
</head>
<body>
    <h1>DIRETORIA DE EXTENSÃO - DIREX</h1>
    <h2>CADASTRO PARA ESTÁGIO</h2>
    <form action="resposta.html" method="get">
        <!-- get fica exposto na url; e post esconde -->

        <label for="nome">Nome: </label>
        <!-- a marcação de label - representa rótulo do compo do formulario, é importante para ACESSIBILIDADE -->

        <input type="text" id="nome" nome="nome" value=""> 
        <!-- o atributo value="" é usado para editar dados de um formulario -->
        <br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail..."> 
        <!-- placeholder é um atributo de rótulo -->
        <br>

        <label for="nascimento">Data de Nascimento:</label>
        <input type="date" id="nascimento">
        <!-- disable é um comando para desativar -->
        <br>

        <label for="curriculo">Currículo</label>
        <input type="file" id="curriculo" required> <br>
        <!-- "required" é um comando que torna o campo obrigatorio -->

        <label for="senha">Senha:</label>
        <input type="password" id="senha" maxlength="7" minlength="3">
        <!-- max e min definem limites de caracteres -->
        <br>

        <label for="uf">Estado:</label>
        <!-- select é chamado de combobox -->
        <select name="uf" id="uf">
            <!-- o componente select é usado para grupo de itens muito similares... o comando 'multiple' permite selecionar vários -->
            <option value="rn">Rio grande do Norte</option>
            <option value="pe" selected>Pernambuco</option>
            <!-- o comando 'selected' deixa o item ativo -->
            <option value="pb">Paraíba</option>
        </select>
        <br>

        <input type="submit" value="ENVIAR">

    </form>
</body>
</html>
