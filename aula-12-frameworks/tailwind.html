<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind CSS Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  
  <body>
    <h1 class="text-3xl font-bold underline">
      Hello world!
    </h1>

    <p class="font-serif p-20 suaclasse rounded-md shadow-2xl">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Numquam architecto pariatur, labore ut adipisci officiis fugit aperiam aliquam quae perspiciatis et repudiandae repellendus earum, veniam aut vel atque sit velit!
    </p>
    <!-- px-20 padding eixo x - esquerda e direita -->
    <!-- py-20 padding eixo y - topo e base -->

    <table class="border-collapse border border-gray-400">
      <thead>
        <tr>
          <th class="border border-gray-300 px-4 py-2">State</th>
          <th class="border border-gray-300 px-4 py-2">City</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="border border-gray-300 px-4 py-2">Indiana</td>
          <td class="border border-gray-300 px-4 py-2">Indianapolis</td>
        </tr>
        <tr>
          <td class="border border-gray-300 px-4 py-2">Ohio</td>
          <td class="border border-gray-300 px-4 py-2">Columbus</td>
        </tr>
        <tr>
          <td class="border border-gray-300 px-4 py-2">Michigan</td>
          <td class="border border-gray-300 px-4 py-2">Detroit</td>
        </tr>
      </tbody>
    </table>
  </body>

</html>
